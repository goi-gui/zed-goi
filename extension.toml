id = "goi"
name = "Goi"
version = "0.1.0"
schema_version = 1
description = "Goi design file (.goi) support: syntax highlighting, diagnostics, completion, hover, outline and go-to-definition."
repository = "https://github.com/goi-gui/zed-goi"
authors = ["goi contributors"]
languages = ["languages/goi"]
capabilities = []

[lib]
kind = "Rust"
version = "0.1.0"

# The language server is a Go binary, so it is not bundled: install it with
#   go install github.com/ksckaan1/goi/cmd/goipls@latest
# and keep it on PATH.
[language_servers.goipls]
name = "goipls"
languages = ["Goi"]

# The grammar lives in this repository, so `path` points at it inside the
# clone. `rev` is a commit on `main` that contains it.
[grammars.goi]
repository = "https://github.com/goi-gui/zed-goi"
path = "tree-sitter-goi"
rev = "b5c500a"
