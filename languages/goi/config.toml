name = "Goi"
grammar = "goi"
path_suffixes = ["goi"]
line_comments = ["// "]
block_comment = ["/* ", " */"]
autoclose_before = ":.,=}])>"
tab_size = 4
hard_tabs = true
word_characters = ["$", "#"]

brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = false },
    { start = "\"", end = "\"", close = true, newline = false, not_in = [
        "comment",
        "string",
    ] },
    { start = "/*", end = " */", close = true, newline = false, not_in = [
        "comment",
        "string",
    ] },
]
